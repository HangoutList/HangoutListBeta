<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Custom Page</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
    }
      
    .header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      background: #1abc9c;
      color: black;
      text-align: center;
      padding: 20px 0;
      font-size: 24px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
      z-index: 1000;
    }

    .content {
      margin-top: 120px;
      text-align: center;
      padding: 20px;
    }

    .divider-left, .divider-right {
      position: fixed;
      top: 0;
      width: 10px;
      height: 100%;
      background-color: #1abc9c;
      z-index: 999;
    }

    .divider-left {
      left: 0;
    }

    .divider-right {
      right: 0;
    }
  </style>
</head>
<body>

  <div class="divider-left"></div>
  <div class="divider-right"></div>

  <div class="header">
    <h1>Header</h1>
    <p>My supercool header</p>
  </div>

  <div class="content">
    <h1>Hello, World!</h1>
    <p>Welcome to my custom GitHub Page.</p>
  </div>

</body>
</html>
